<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Solver Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="chat">
      <div id="header">
        <h1>Math Solver Demo</h1>
        <button id="new-chat-btn" type="button">New Chat</button>
      </div>
      <div id="messages"></div>
      <form id="chat-form">
        <input
          id="chat-input"
          type="text"
          placeholder="Ask a math or physics question..."
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </div>
    <script src="app.js"></script>
  </body>
</html>
